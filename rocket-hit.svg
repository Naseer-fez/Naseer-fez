<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <style>
    .rocket {
      transform-origin: 25px 25px;
      animation: fly-and-hit 3s ease-in infinite;
    }
    .flame {
      transform-origin: 25px 40px;
      animation: flicker 0.1s infinite alternate;
    }
    @keyframes fly-and-hit {
      0% { transform: translateX(200px) rotate(-90deg); }
      40% { transform: translateX(15px) rotate(-90deg); }  /* Hit */
      45% { transform: translateX(20px) rotate(-85deg); }  /* Bounce back */
      50% { transform: translateX(12px) rotate(-95deg); }
      55% { transform: translateX(18px) rotate(-88deg); }
      60% { transform: translateX(15px) rotate(-90deg); }
      75% { transform: translateX(15px) rotate(-90deg) scale(1); opacity: 1; }
      100% { transform: translateX(15px) rotate(-90deg) scale(0); opacity: 0; }
    }
    @keyframes flicker {
      0% { transform: scaleY(1) scaleX(1); opacity: 1; }
      100% { transform: scaleY(1.4) scaleX(1.2); opacity: 0.7; }
    }
  </style>

  <g class="rocket">
    <!-- Flames -->
    <path class="flame" d="M 18 40 L 25 55 L 32 40 Z" fill="#FF9800" />
    <path class="flame" d="M 21 40 L 25 48 L 29 40 Z" fill="#FFEB3B" style="animation-delay: 0.05s;" />

    <!-- Fins -->
    <path d="M 15 35 L 5 45 L 20 35 Z" fill="#E53935" />
    <path d="M 35 35 L 45 45 L 30 35 Z" fill="#E53935" />
    
    <!-- Rocket Body -->
    <path d="M 25 5 C 35 15, 35 35, 35 40 L 15 40 C 15 35, 15 15, 25 5 Z" fill="#E0E0E0" />
    
    <!-- Window -->
    <circle cx="25" cy="22" r="4" fill="#29B6F6" stroke="#9E9E9E" stroke-width="1.5" />
    
    <!-- Nose Cone -->
    <path d="M 25 5 C 30 10, 32 15, 32 18 L 18 18 C 18 15, 20 10, 25 5 Z" fill="#E53935" />
  </g>
</svg>
