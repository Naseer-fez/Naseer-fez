<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .plant {
      transform-origin: 50px 85px;
      animation: grow 4s ease-out infinite;
    }
    @keyframes grow {
      0%, 10% { transform: scale(0); }
      40%, 70% { transform: scale(1); }
      90%, 100% { transform: scale(0); }
    }
  </style>
  
  <!-- Soil / Base (Static) -->
  <path d="M 30 85 C 30 95, 70 95, 70 85 Z" fill="#8D6E63" />
  
  <g class="plant">
    <!-- Stem -->
    <path d="M 50 85 Q 45 55 50 25" fill="none" stroke="#7CB342" stroke-width="6" stroke-linecap="round" />
    
    <!-- Left Leaf -->
    <path d="M 48 55 C 20 60, 15 35, 30 30 C 45 25, 45 45, 48 55 Z" fill="#8BC34A" />
    
    <!-- Right Leaf -->
    <path d="M 51 45 C 80 40, 75 15, 60 10 C 45 5, 45 35, 51 45 Z" fill="#8BC34A" />
  </g>
</svg>
