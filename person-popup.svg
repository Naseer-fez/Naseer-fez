<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .person {
      animation: popup 4s ease-in-out infinite;
    }
    @keyframes popup {
      0%, 20% { transform: translateY(100px); }
      40%, 60% { transform: translateY(0); }
      80%, 100% { transform: translateY(100px); }
    }
  </style>
  <defs>
    <clipPath id="circleView">
      <circle cx="50" cy="50" r="45" />
    </clipPath>
  </defs>
  <g clip-path="url(#circleView)">
    <!-- Background to match standard emoji / generic background (optional, but let's keep it transparent) -->
    <!-- <circle cx="50" cy="50" r="45" fill="#E1E8ED"/> -->
    
    <g class="person">
      <!-- Shoulders/Body -->
      <path d="M 20 100 C 20 60, 80 60, 80 100 Z" fill="#55ACEE" />
      
      <!-- Neck -->
      <rect x="42" y="65" width="16" height="15" fill="#FADCB3" />
      
      <!-- Head -->
      <circle cx="50" cy="45" r="22" fill="#FADCB3" />
      
      <!-- Hair -->
      <path d="M 28 45 C 28 20, 72 20, 72 45 C 72 35, 60 22, 50 22 C 40 22, 28 35, 28 45 Z" fill="#292F33" />
      <path d="M 28 45 C 25 35, 30 25, 40 20 C 55 15, 75 25, 72 45 C 75 35, 70 20, 50 15 C 30 15, 25 35, 28 45 Z" fill="#292F33" />
      
      <!-- Eyes -->
      <circle cx="42" cy="42" r="3" fill="#664500" />
      <circle cx="58" cy="42" r="3" fill="#664500" />
      
      <!-- Smile -->
      <path d="M 45 52 Q 50 58 55 52" fill="none" stroke="#664500" stroke-width="2" stroke-linecap="round" />
      
      <!-- Laptop in front -->
      <rect x="15" y="80" width="70" height="40" rx="4" fill="#99AAB5" />
      <path d="M 50 90 A 5 5 0 1 1 49.9 90" stroke="#CCD6DD" stroke-width="2" />
    </g>
  </g>
  <!-- Frame/Mask Border to define the view area -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#E1E8ED" stroke-width="4" />
</svg>
