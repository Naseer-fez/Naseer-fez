<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .hand {
      transform-origin: 50px 85px;
      animation: wave 2.5s infinite ease-in-out;
    }
    @keyframes wave {
      0% { transform: rotate(0deg); }
      15% { transform: rotate(20deg); }
      30% { transform: rotate(-10deg); }
      45% { transform: rotate(20deg); }
      60% { transform: rotate(-10deg); }
      75% { transform: rotate(10deg); }
      90%, 100% { transform: rotate(0deg); }
    }
  </style>

  <!-- The Hand Group -->
  <g class="hand">
    <!-- Wrist -->
    <rect x="35" y="70" width="30" height="40" fill="#FFCC4D" />
    
    <!-- Palm Body -->
    <rect x="31" y="55" width="50" height="20" fill="#FFCC4D" rx="5" />
    
    <!-- Fingers (using thick overlapping strokes for perfect round tips) -->
    <!-- Thumb -->
    <path d="M 35 65 L 15 48" stroke="#FFCC4D" stroke-width="15" stroke-linecap="round" fill="none" />
    
    <!-- Index Finger -->
    <path d="M 38 60 L 38 25" stroke="#FFCC4D" stroke-width="14" stroke-linecap="round" fill="none" />
    
    <!-- Middle Finger -->
    <path d="M 50 60 L 50 15" stroke="#FFCC4D" stroke-width="14" stroke-linecap="round" fill="none" />
    
    <!-- Ring Finger -->
    <path d="M 62 60 L 62 22" stroke="#FFCC4D" stroke-width="14" stroke-linecap="round" fill="none" />
    
    <!-- Pinky Finger -->
    <path d="M 74 60 L 74 35" stroke="#FFCC4D" stroke-width="14" stroke-linecap="round" fill="none" />
    
    <!-- Finger separation lines for definition -->
    <path d="M 44 35 L 44 58" stroke="#E5A817" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 56 35 L 56 58" stroke="#E5A817" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 68 45 L 68 58" stroke="#E5A817" stroke-width="1.5" stroke-linecap="round" fill="none" />
    
    <!-- Palm/Thumb crease -->
    <path d="M 32 65 C 38 65, 42 70, 42 75" stroke="#E5A817" stroke-width="1.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Sleeve (Static to cover wrist joint) -->
  <path d="M 28 85 C 45 80, 55 80, 72 85 L 80 110 L 20 110 Z" fill="#55ACEE" />
  
  <!-- Sleeve Cuff line -->
  <path d="M 26 89 C 45 84, 55 84, 74 89" fill="none" stroke="#3B88C3" stroke-width="4" stroke-linecap="round" />
</svg>
