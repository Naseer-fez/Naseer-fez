<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .screen-text {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      fill: #4CAF50;
      font-size: 14px;
      overflow: hidden;
      white-space: nowrap;
      animation: typing 3s steps(2, end) infinite;
    }
    .cursor {
      fill: #4CAF50;
      animation: blink 1s step-end infinite;
    }
    @keyframes typing {
      0%, 20% { clip-path: inset(0 100% 0 0); }
      40% { clip-path: inset(0 50% 0 0); }
      60%, 80% { clip-path: inset(0 0 0 0); }
      90%, 100% { clip-path: inset(0 100% 0 0); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
  <g>
    <!-- Laptop Base -->
    <rect x="5" y="75" width="90" height="10" rx="3" fill="#B0BEC5" />
    <path d="M 15 75 L 20 80 L 80 80 L 85 75 Z" fill="#90A4AE" />
    
    <!-- Laptop Lid -->
    <rect x="15" y="20" width="70" height="55" rx="5" fill="#CFD8DC" />
    
    <!-- Screen -->
    <rect x="20" y="25" width="60" height="45" rx="2" fill="#263238" />
    
    <!-- Text area with typing effect -->
    <g transform="translate(25, 40)">
      <text x="0" y="0" class="screen-text">hi</text>
      <rect x="18" y="-12" width="6" height="14" class="cursor">
        <animate attributeName="x" values="0; 8; 18; 0" keyTimes="0; 0.4; 0.6; 0.9" calcMode="discrete" dur="3s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
