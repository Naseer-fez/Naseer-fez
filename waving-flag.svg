<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .flag-cloth {
      transform-origin: 25px 20px;
      animation: wave 1.5s ease-in-out infinite alternate;
    }
    @keyframes wave {
      0% { transform: skewY(5deg) scaleX(0.9); }
      100% { transform: skewY(-15deg) scaleX(1); }
    }
  </style>
  
  <!-- Pole -->
  <rect x="22" y="10" width="6" height="80" rx="3" fill="#90A4AE" />
  
  <!-- Pole Knob -->
  <circle cx="25" cy="8" r="6" fill="#FFB300" />
  
  <!-- Flag Cloth -->
  <g class="flag-cloth">
    <path d="M 25 15 L 85 30 L 25 55 Z" fill="#F44336" />
    <!-- Adding a secondary tone for depth -->
    <path d="M 25 15 L 60 25 L 25 40 Z" fill="#E53935" />
  </g>
</svg>
